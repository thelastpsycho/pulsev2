<!DOCTYPE html>
<html>
<head>
    <title>Debug Permissions</title>
    <style>
        body { font-family: system-ui; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Permission Debugger</h1>
    <div id="status">Checking permissions...</div>

    <script>
        async function checkPermissions() {
            const status = document.getElementById('status');
            const token = localStorage.getItem('gp_token');

            if (!token) {
                status.innerHTML = '<p class="error">No token found. Please log in first.</p>';
                return;
            }

            try {
                const response = await fetch('http://localhost:8000/api/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const data = await response.json();
                const user = data.user;

                status.innerHTML = `
                    <h2>User Info</h2>
                    <p><strong>Name:</strong> ${user.name}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Roles:</strong> ${user.roles.map(r => r.name).join(', ')}</p>

                    <h2>Permissions (${user.permissions.length} total)</h2>
                    <ul>
                        ${user.permissions.map(p => `<li class="${p === 'issues.verify' ? 'success' : 'info'}">${p}</li>`).join('')}
                    </ul>

                    <h2>Verification Check</h2>
                    <p class="${user.permissions.includes('issues.verify') ? 'success' : 'error'}">
                        ${user.permissions.includes('issues.verify') ? '✓ HAS issues.verify permission' : '✗ MISSING issues.verify permission'}
                    </p>

                    <p><em>Open browser console (F12) for more details</em></p>
                `;

                console.log('User data:', user);
                console.log('Permissions:', user.permissions);
                console.log('Has issues.verify:', user.permissions.includes('issues.verify'));

            } catch (error) {
                status.innerHTML = `<p class="error">Error: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }

        checkPermissions();
    </script>
</body>
</html>
